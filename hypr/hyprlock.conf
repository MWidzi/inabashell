source=~/.config/hypr/colors.conf
source=~/.config/hypr/mainMonitor.conf

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# GENERAL
general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = false
}

# INPUT FIELD
input-field {
    monitor = $mainMonitor
    size = 250, 60
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    inner_color = $bg
    font_color = $fg
    font_family = Mononoki Nerd Font
    fade_on_empty = false
    rounding = 20
    check_color = $mchr2
    fail_color = $mchr0
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

# DATE
label {
    monitor = $mainMonitor
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = $fg
    font_size = 22
    font_family = Mononoki Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# TIME
label {
    monitor = $mainMonitor 
    text = $TIME
    color = $fg
    font_size = 95
    font_family = JetBrains Mono Extrabold
    position = 0, 0
    halign = center
    valign = center
}

# CURRENT SONG
label {
    monitor = $mainMonitor
    text = cmd[update:1000] echo "$(~/.config/scripts/get-song.sh)"
    color = $fg
    font_size = 18
    font_family = Mononoki Nerd Font
    position = 0, 50
    halign = center
    valign = bottom
}

# BATTERY
label {
    monitor = $mainMonitor
    text = cmd[update:1000] echo "$(~/.config/scripts/get-battery.sh)"
    color = $fg
    font_size = 20
    font_family = Mononoki Nerd Font
    position = -10, -10
    halign = right
    valign = top
}
